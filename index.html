<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird - Mini</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    .wrap { position: relative; }
    canvas {
      display: block;
      width: min(420px, 94vw);
      height: auto;
      background: #87ceeb;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
      touch-action: manipulation;
      cursor: pointer;
    }
    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,.85);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="game" width="420" height="640" tabindex="0" aria-label="Flappy Bird game"></canvas>
  </div>
  <div class="hint">Space / Click / Tap to flap • R to restart</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const W = canvas.width;
  const H = canvas.height;
  const groundH = 80;

  const bird = {
    x: 110, y: 220, r: 14, vy: 0,
    gravity: 0.48, flap: -7.2, tilt: 0
  };

  const pipe = {
    w: 58,
    gap: 165,
    speed: 3.2,
    spacing: 185
  };

  let pipes = [];
  let score = 0;
  let best = Number(localStorage.getItem("flappy_best") || 0);
  let running = false;
  let gameOver = false;
  let started = false;
  let lastTime = 0;

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function reset() {
    bird.y = 220;
    bird.vy = 0;
    pipes = [];
    score = 0;
    pipe.speed = 3.2;
    pipe.gap = 165;
    running = false;
    gameOver = false;
    started = false;
    lastTime = 0;
    render();
  }

  function startGame() {
    if (gameOver) reset();

    running = true;
    started = true;
    bird.vy = bird.flap;

    if (!lastTime) {
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function spawnPipe() {
    const topMin = 70;
    const topMax = H - groundH - 70 - pipe.gap;
    const topH = Math.floor(rand(topMin, topMax));
    pipes.push({
      x: W + 40,
      topH,
      passed: false
    });
  }

  function collideCircleRect(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return dx * dx + dy * dy <= r * r;
  }

  function endGame() {
    running = false;
    gameOver = true;

    if (score > best) {
      best = score;
      localStorage.setItem("flappy_best", String(best));
    }
  }

  function update(dt) {
    const frameScale = dt / 16.67;

    if (pipes.length === 0 ||
        pipes[pipes.length - 1].x < W - pipe.spacing) {
      spawnPipe();
    }

    bird.vy += bird.gravity * frameScale;
    bird.y += bird.vy * frameScale;

    if (bird.y + bird.r >= H - groundH) {
      bird.y = H - groundH - bird.r;
      endGame();
      return;
    }

    if (bird.y - bird.r <= 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }

    for (const p of pipes) {
      p.x -= pipe.speed * frameScale;

      if (!p.passed && p.x + pipe.w < bird.x) {
        p.passed = true;
        score++;
        pipe.speed = Math.min(6.2, pipe.speed + 0.08);
        pipe.gap = Math.max(120, pipe.gap - 1);
      }

      const bottomY = p.topH + pipe.gap;

      const hitTop = collideCircleRect(
        bird.x, bird.y, bird.r,
        p.x, 0, pipe.w, p.topH
      );

      const hitBottom = collideCircleRect(
        bird.x, bird.y, bird.r,
        p.x, bottomY, pipe.w, H - groundH - bottomY
      );

      if (hitTop || hitBottom) {
        endGame();
        return;
      }
    }

    pipes = pipes.filter(p => p.x + pipe.w > -30);
  }

  function drawText(text, x, y, size = 20, color = "white", align = "left") {
    ctx.fillStyle = color;
    ctx.font = `700 ${size}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function render() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#87ceeb");
    g.addColorStop(1, "#bfe9ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (const c of [
      {x: 70, y: 105, s: 1},
      {x: 250, y: 170, s: .75},
      {x: 365, y: 120, s: .6}
    ]) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 20*c.s, 0, Math.PI*2);
      ctx.arc(c.x+22*c.s, c.y-8*c.s, 25*c.s, 0, Math.PI*2);
      ctx.arc(c.x+47*c.s, c.y, 18*c.s, 0, Math.PI*2);
      ctx.fill();
    }

    // Sun
    ctx.beginPath();
    ctx.arc(330, 90, 30, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,220,120,.95)";
    ctx.fill();

    // Pipes
    for (const p of pipes) {
      const bottomY = p.topH + pipe.gap;

      ctx.fillStyle = "#2ecc71";
      ctx.fillRect(p.x, 0, pipe.w, p.topH);
      ctx.fillRect(p.x, bottomY, pipe.w, H - groundH - bottomY);

      ctx.fillStyle = "#27ae60";
      ctx.fillRect(p.x - 3, p.topH - 10, pipe.w + 6, 10);
      ctx.fillRect(p.x - 3, bottomY, pipe.w + 6, 10);

      ctx.strokeStyle = "rgba(0,0,0,.15)";
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, 0, pipe.w, p.topH);
      ctx.strokeRect(p.x, bottomY, pipe.w, H - groundH - bottomY);
    }

    // Ground
    ctx.fillStyle = "#3b3b3b";
    ctx.fillRect(0, H - groundH, W, groundH);

    ctx.fillStyle = "#2a2a2a";
    const offset = (Date.now() / 60) % 36;
    for (let i = -36; i < W + 36; i += 36) {
      ctx.fillRect(i + offset, H - groundH + 18, 14, groundH - 28);
    }

    // Bird
    bird.tilt = Math.max(-0.6, Math.min(0.75, bird.vy / 11));
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.tilt);

    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd166";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#cc8a00";
    ctx.stroke();

    // Wing
    ctx.beginPath();
    ctx.ellipse(-3, 7, 8, 5, -.35, 0, Math.PI * 2);
    ctx.fillStyle = "#f4b942";
    ctx.fill();

    // Eye
    ctx.beginPath();
    ctx.arc(6, -5, 4, 0, Math.PI * 2);
    ctx.fillStyle = "#1b1b1b";
    ctx.fill();

    // Beak
    ctx.beginPath();
    ctx.moveTo(bird.r - 2, 0);
    ctx.lineTo(bird.r + 10, 4);
    ctx.lineTo(bird.r - 2, 8);
    ctx.closePath();
    ctx.fillStyle = "#ff7a00";
    ctx.fill();

    ctx.restore();

    drawText(`Score: ${score}`, 16, 34, 20, "rgba(0,0,0,.75)");
    drawText(`Best: ${best}`, 16, 60, 16, "rgba(0,0,0,.55)");

    if (!started && !gameOver) {
      ctx.fillStyle = "rgba(0,0,0,.18)";
      ctx.fillRect(45, 250, W - 90, 135);
      drawText("FLAPPY BIRD", W/2, 295, 32, "white", "center");
      drawText("Click, tap, or press Space", W/2, 330, 18, "white", "center");
      drawText("to start", W/2, 357, 18, "white", "center");
    }

    if (gameOver) {
      ctx.fillStyle = "rgba(0,0,0,.4)";
      ctx.fillRect(0, 0, W, H);

      drawText("Game Over", W/2, H/2 - 30, 38, "white", "center");
      drawText(`Score: ${score}`, W/2, H/2 + 10, 22, "white", "center");
      drawText(`Best: ${best}`, W/2, H/2 + 40, 18, "white", "center");
      drawText("Press R, Enter, or click to restart", W/2, H/2 + 78, 16, "white", "center");
    }
  }

  function loop(t) {
    const dt = Math.min(32, t - lastTime || 16.67);
    lastTime = t;

    if (running && !gameOver) update(dt);
    render();

    if (running && !gameOver) {
      requestAnimationFrame(loop);
    }
  }

  function handleInput(e) {
    e.preventDefault?.();
    canvas.focus();

    if (gameOver) {
      reset();
      startGame();
      return;
    }

    if (!started) {
      startGame();
      return;
    }

    if (running) {
      bird.vy = bird.flap;
    }
  }

  document.addEventListener("keydown", e => {
    // Space and ArrowUp are the flap controls.
    if (e.code === "Space" || e.key === " " || e.key === "Spacebar" || e.code === "ArrowUp") {
      e.preventDefault();
      e.stopPropagation();

      // Ignore auto-repeat so holding Space does not create rapid flaps.
      if (e.repeat) return;

      if (gameOver) {
        reset();
        startGame();
      } else if (!started) {
        startGame();
      } else if (running) {
        bird.vy = bird.flap;
      }
      return;
    }

    if (e.key === "r" || e.key === "R") {
      e.preventDefault();
      reset();
      canvas.focus();
      return;
    }

    if (e.key === "Enter" && gameOver) {
      e.preventDefault();
      reset();
      startGame();
    }
  });

  canvas.addEventListener("mousedown", handleInput);
  canvas.addEventListener("touchstart", handleInput, { passive: false });

  render();
})();
</script>
</body>
</html>
