<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Bird - Mini</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .wrap { position: relative; }

    canvas {
      display: block;
      width: min(420px, 94vw);
      height: auto;
      background: #87ceeb;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,.35);
      touch-action: manipulation;
      cursor: pointer;
    }

    .hint {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,.85);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <canvas id="game" width="420" height="640" tabindex="0" aria-label="Flappy Bird game"></canvas>
  </div>

  <div class="hint">Space / Click / Tap to flap • R to restart</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const W = canvas.width;
  const H = canvas.height;
  const groundH = 80;

  const bird = {
    x: 110,
    y: 220,
    r: 14,
    vy: 0,
    gravity: 0.42,
    flap: -6.8,
    tilt: 0
  };

  const pipe = {
    w: 58,
    gap: 165,
    speed: 3.2,
    spacing: 185
  };

  let pipes = [];
  let score = 0;
  let best = Number(localStorage.getItem("flappy_best") || 0);

  let running = false;
  let gameOver = false;
  let started = false;
  let lastTime = 0;

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  function reset() {
    bird.y = 220;
    bird.vy = 0;
    pipes = [];
    score = 0;

    pipe.speed = 3.2;
    pipe.gap = 165;

    running = false;
    gameOver = false;
    started = false;
    lastTime = 0;

    render();
  }

  function startGame() {
    if (gameOver) reset();

    running = true;
    started = true;
    bird.vy = bird.flap;

    if (!lastTime) {
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function spawnPipe() {
    const topMin = 70;
    const topMax = H - groundH - 70 - pipe.gap;
    const topH = Math.floor(rand(topMin, topMax));

    pipes.push({
      x: W + 40,
      topH,
      passed: false
    });
  }

  function collideCircleRect(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));

    const dx = cx - closestX;
    const dy = cy - closestY;

    return dx * dx + dy * dy <= r * r;
  }

  function endGame() {
    running = false;
    gameOver = true;

    if (score > best) {
      best = score;
      localStorage.setItem("flappy_best", String(best));
    }
  }

  function update(dt) {
    const frameScale = dt / 16.67;

    if (
      pipes.length === 0 ||
      pipes[pipes.length - 1].x < W - pipe.spacing
    ) {
      spawnPipe();
    }

    // Bird physics
    bird.vy += bird.gravity * frameScale;
    bird.y += bird.vy * frameScale;

    // Ground collision
    if (bird.y + bird.r >= H - groundH) {
      bird.y = H - groundH - bird.r;
      endGame();
      return;
    }

    // Ceiling collision
    if (bird.y - bird.r <= 0) {
      bird.y = bird.r;
      bird.vy = 0;
    }

    // Pipe movement and collisions
    for (const p of pipes) {
      p.x -= pipe.speed * frameScale;

      // Score
      if (!p.passed && p.x + pipe.w < bird.x) {
        p.passed = true;
        score++;

        pipe.speed = Math.min(6.2, pipe.speed + 0.08);
        pipe.gap = Math.max(120, pipe.gap - 1);
      }

      const bottomY = p.topH + pipe.gap;

      const hitTop = collideCircleRect(
        bird.x,
        bird.y,
        bird.r,
        p.x,
        0,
        pipe.w,
        p.topH
      );

      const hitBottom = collideCircleRect(
        bird.x,
        bird.y,
        bird.r,
        p.x,
        bottomY,
        pipe.w,
        H - groundH - bottomY
      );

      if (hitTop || hitBottom) {
        endGame();
        return;
      }
    }

    pipes = pipes.filter(p => p.x + pipe.w > -30);
  }

  function drawText(
    text,
    x,
    y,
    size = 20,
    color = "white",
    align = "left"
  ) {
    ctx.fillStyle = color;

    ctx.font =
      `700 ${size}px system-ui, -apple-system, Segoe UI, Roboto, Arial`;

    ctx.textAlign = align;
    ctx.fillText(text, x, y);
  }

  function render() {
    // Sky
    const g = ctx.createLinearGradient(0, 0, 0, H);

    g.addColorStop(0, "#4fa9d8");
    g.addColorStop(0.55, "#8ed0ea");
    g.addColorStop(1, "#d9f1f7");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sun glow
    const sun =
      ctx.createRadialGradient(
        330,
        90,
        5,
        330,
        90,
        70
      );

    sun.addColorStop(
      0,
      "rgba(255,245,190,.95)"
    );

    sun.addColorStop(
      1,
      "rgba(255,245,190,0)"
    );

    ctx.fillStyle = sun;
    ctx.fillRect(
      260,
      20,
      140,
      140
    );

    // Sun
    ctx.beginPath();

    ctx.arc(
      330,
      90,
      27,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#fff0a6";
    ctx.fill();

    // Clouds
    for (const c of [
      { x: 70, y: 110, s: 1 },
      { x: 255, y: 170, s: .72 },
      { x: 380, y: 130, s: .55 }
    ]) {
      ctx.fillStyle =
        "rgba(255,255,255,.72)";

      ctx.beginPath();

      ctx.arc(
        c.x,
        c.y,
        20 * c.s,
        0,
        Math.PI * 2
      );

      ctx.arc(
        c.x + 22 * c.s,
        c.y - 8 * c.s,
        25 * c.s,
        0,
        Math.PI * 2
      );

      ctx.arc(
        c.x + 47 * c.s,
        c.y,
        18 * c.s,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    // Distant hills
    ctx.fillStyle =
      "rgba(83,145,120,.38)";

    ctx.beginPath();

    ctx.moveTo(
      0,
      H - groundH - 55
    );

    for (
      let x = 0;
      x <= W;
      x += 30
    ) {
      ctx.lineTo(
        x,
        H -
          groundH -
          55 -
          Math.sin(x / 58) * 22
      );
    }

    ctx.lineTo(
      W,
      H - groundH
    );

    ctx.lineTo(
      0,
      H - groundH
    );

    ctx.closePath();
    ctx.fill();

    // Pipes
    for (const p of pipes) {
      const bottomY =
        p.topH + pipe.gap;

      const bottomHeight =
        H - groundH - bottomY;

      function drawPipe(
        x,
        y,
        w,
        h,
        capY
      ) {
        const pg =
          ctx.createLinearGradient(
            x,
            0,
            x + w,
            0
          );

        pg.addColorStop(
          0,
          "#176b3d"
        );

        pg.addColorStop(
          0.2,
          "#2fa85c"
        );

        pg.addColorStop(
          0.48,
          "#62d27e"
        );

        pg.addColorStop(
          0.8,
          "#2b9d55"
        );

        pg.addColorStop(
          1,
          "#145d37"
        );

        ctx.fillStyle = pg;

        ctx.fillRect(
          x,
          y,
          w,
          h
        );

        // Highlight
        ctx.fillStyle =
          "rgba(255,255,255,.15)";

        ctx.fillRect(
          x + 8,
          y,
          7,
          h
        );

        // Outline
        ctx.strokeStyle =
          "rgba(0,0,0,.25)";

        ctx.lineWidth = 2;

        ctx.strokeRect(
          x,
          y,
          w,
          h
        );

        // Pipe cap
        ctx.fillStyle =
          "#2b9d55";

        ctx.fillRect(
          x - 4,
          capY,
          w + 8,
          11
        );

        ctx.fillStyle =
          "rgba(255,255,255,.16)";

        ctx.fillRect(
          x + 4,
          capY + 2,
          w - 8,
          3
        );

        ctx.strokeStyle =
          "rgba(0,0,0,.25)";

        ctx.strokeRect(
          x - 4,
          capY,
          w + 8,
          11
        );
      }

      drawPipe(
        p.x,
        0,
        pipe.w,
        p.topH,
        p.topH - 11
      );

      drawPipe(
        p.x,
        bottomY,
        pipe.w,
        bottomHeight,
        bottomY
      );
    }

    // Ground
    ctx.fillStyle = "#5b5140";

    ctx.fillRect(
      0,
      H - groundH,
      W,
      groundH
    );

    // Grass
    ctx.fillStyle = "#6f9d43";

    ctx.fillRect(
      0,
      H - groundH,
      W,
      12
    );

    ctx.fillStyle = "#4f7d36";

    ctx.fillRect(
      0,
      H - groundH + 10,
      W,
      4
    );

    // Moving ground texture
    const offset =
      (Date.now() / 45) % 42;

    ctx.fillStyle =
      "rgba(40,40,30,.38)";

    for (
      let i = -42;
      i < W + 42;
      i += 42
    ) {
      ctx.fillRect(
        i + offset,
        H - groundH + 25,
        20,
        4
      );

      ctx.fillRect(
        i + offset - 12,
        H - groundH + 48,
        13,
        4
      );
    }

    // Bird
    bird.tilt =
      Math.max(
        -0.55,
        Math.min(
          0.8,
          bird.vy / 11
        )
      );

    ctx.save();

    ctx.translate(
      bird.x,
      bird.y
    );

    ctx.rotate(
      bird.tilt
    );

    // Bird shadow
    ctx.beginPath();

    ctx.ellipse(
      1,
      16,
      13,
      4,
      0,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(0,0,0,.12)";

    ctx.fill();

    // Bird gradient
    const bg =
      ctx.createRadialGradient(
        -5,
        -7,
        2,
        0,
        0,
        bird.r + 4
      );

    bg.addColorStop(
      0,
      "#fff0a0"
    );

    bg.addColorStop(
      0.55,
      "#ffd166"
    );

    bg.addColorStop(
      1,
      "#e7a928"
    );

    // Body
    ctx.beginPath();

    ctx.arc(
      0,
      0,
      bird.r,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = bg;
    ctx.fill();

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#9f6e12";
    ctx.stroke();

    // Wing
    ctx.beginPath();

    ctx.ellipse(
      -5,
      6,
      9,
      5.5,
      -.25,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "#eeb13b";

    ctx.fill();

    ctx.strokeStyle =
      "#a87616";

    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Eye
    ctx.beginPath();

    ctx.arc(
      6,
      -5,
      4.5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "white";
    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      7,
      -5,
      2,
      0,
      Math.PI * 2
    );

    ctx.fillStyle = "#171717";
    ctx.fill();

    // Beak
    ctx.beginPath();

    ctx.moveTo(
      bird.r - 2,
      -1
    );

    ctx.lineTo(
      bird.r + 11,
      4
    );

    ctx.lineTo(
      bird.r - 2,
      9
    );

    ctx.closePath();

    ctx.fillStyle = "#f47d20";
    ctx.fill();

    ctx.strokeStyle =
      "#a94e12";

    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.restore();

    // Score panel
    ctx.fillStyle =
      "rgba(255,255,255,.18)";

    ctx.fillRect(
      10,
      10,
      105,
      62
    );

    drawText(
      `Score: ${score}`,
      18,
      35,
      20,
      "rgba(0,0,0,.78)"
    );

    drawText(
      `Best: ${best}`,
      18,
      59,
      15,
      "rgba(0,0,0,.58)"
    );

    // Start screen
    if (!started && !gameOver) {
      ctx.fillStyle =
        "rgba(10,25,35,.30)";

      ctx.fillRect(
        35,
        235,
        W - 70,
        165
      );

      drawText(
        "FLAPPY BIRD",
        W / 2,
        285,
        34,
        "white",
        "center"
      );

      drawText(
        "Click, tap, or press Space",
        W / 2,
        323,
        17,
        "white",
        "center"
      );

      drawText(
        "to fly",
        W / 2,
        350,
        17,
        "white",
        "center"
      );

      drawText(
        "Avoid the pipes",
        W / 2,
        378,
        15,
        "rgba(255,255,255,.85)",
        "center"
      );
    }

    // Game over screen
    if (gameOver) {
      ctx.fillStyle =
        "rgba(0,0,0,.42)";

      ctx.fillRect(
        0,
        0,
        W,
        H
      );

      ctx.fillStyle =
        "rgba(20,30,35,.82)";

      ctx.fillRect(
        55,
        230,
        W - 110,
        180
      );

      drawText(
        "Game Over",
        W / 2,
        275,
        38,
        "white",
        "center"
      );

      drawText(
        `Score: ${score}`,
        W / 2,
        315,
        22,
        "white",
        "center"
      );

      drawText(
        `Best: ${best}`,
        W / 2,
        345,
        18,
        "white",
        "center"
      );

      drawText(
        "Click or press Space to play again",
        W / 2,
        385,
        15,
        "rgba(255,255,255,.9)",
        "center"
      );
    }
  }

  function loop(time) {
    const dt =
      Math.min(
        32,
        time - lastTime || 16.67
      );

    lastTime = time;

    if (running && !gameOver) {
      update(dt);
    }

    render();

    if (running && !gameOver) {
      requestAnimationFrame(loop);
    }
  }

  function handleInput(e) {
    e.preventDefault?.();

    canvas.focus();

    if (gameOver) {
      reset();
      startGame();
      return;
    }

    if (!started) {
      startGame();
      return;
    }

    if (running) {
      bird.vy = bird.flap;
    }
  }

  // Keyboard controls
  document.addEventListener("keydown", e => {
    if (
      e.code === "Space" ||
      e.key === " " ||
      e.key === "Spacebar" ||
      e.code === "ArrowUp"
    ) {
      e.preventDefault();
      e.stopPropagation();

      if (e.repeat) return;

      if (gameOver) {
        reset();
        startGame();
      } else if (!started) {
        startGame();
      } else if (running) {
        bird.vy = bird.flap;
      }

      return;
    }

    if (
      e.key === "r" ||
      e.key === "R"
    ) {
      e.preventDefault();
      reset();
      canvas.focus();
      return;
    }

    if (
      e.key === "Enter" &&
      gameOver
    ) {
      e.preventDefault();
      reset();
      startGame();
    }
  });

  // Mouse
  canvas.addEventListener(
    "mousedown",
    handleInput
  );

  // Touch
  canvas.addEventListener(
    "touchstart",
    handleInput,
    { passive: false }
  );

  render();
})();
</script>
</body>
</html>
